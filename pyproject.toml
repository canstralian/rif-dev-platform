[project]
name = "rif-dev-platform"
version = "0.1.0"
description = "RIF Developer Platform"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.16",
  "rich>=14",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "httpx>=0.28",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "structlog>=25.4",
]

[project.scripts]
rif = "rif.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rif"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
